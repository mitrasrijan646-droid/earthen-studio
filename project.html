<script type="text/javascript" defer="defer" async="async">
const $dropdown = $(".dropdown");
const $dropdownToggle = $(".dropdown-menu");
const $dropdownMenu = $(".dropdown-menu");
const showClass = "show";
 
$(window).on("load resize", function() {
  if (this.matchMedia("(min-width: 991px)").matches) {
    $dropdown.hover(
      function() {
        const $this = $(this);
        $this.addClass(showClass);
        $this.find($dropdownToggle).attr("aria-expanded", "true");
        $this.find($dropdownMenu).addClass(showClass);
      },
      function() {
        const $this = $(this);
        $this.removeClass(showClass);
        $this.find($dropdownToggle).attr("aria-expanded", "false");
        $this.find($dropdownMenu).removeClass(showClass);
      }
    );
  } else {
    $dropdown.off("mouseenter mouseleave");
  }
});
</script>

<script>
	document.addEventListener('DOMContentLoaded', function () {
    var currentPage = window.location.pathname.split('/').pop().replace('.html', '');
    if (currentPage === '' || currentPage === 'index') {
        currentPage = 'index';
    }

    document.querySelectorAll('.nav.navbar-nav li a').forEach(function (link) {
        var linkPage = link.getAttribute('href').split('/').pop().replace('.html', '');
        if (linkPage === currentPage) {
            link.parentElement.classList.add('active');
        }
    });
});
</script>

<script type="text/javascript">
{
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('animate');
            } else {
                entry.target.classList.remove('animate');
            }
        });
    }, { threshold: 0.2 });

    document.querySelectorAll('.ap-card, .ap-card h2, .ap-card p, .lwrbxwrppr h2, .lwrbxwrppr h1, .lwrbxwrppr a').forEach(el => {
        observer.observe(el);
    });
}
</script>

<script type="text/javascript">
{
    const section = document.getElementById('apSection');
    const card    = document.getElementById('apCard');
    const bg      = document.getElementById('apBg');

    /* Card entrance animation */
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) card.classList.add('visible');
        });
    }, { threshold: 0.25 });
    observer.observe(section);

    /* Parallax — runs on every scroll tick */
    function doParallax() {
        const rect     = section.getBoundingClientRect();
        const viewH    = window.innerHeight;
        const progress = (viewH - rect.top) / (viewH + rect.height);
        const shift    = (progress - 0.5) * 400;   /* ← increased to 200 for strong effect */
        bg.style.transform = `translateY(${shift}px)`;
    }

    /* Run once on load so it's positioned correctly */
    doParallax();

    /* Run on every scroll */
    window.addEventListener('scroll', doParallax, { passive: true });
}
</script>

<script>
/* ── What Section Parallax ── */
{
    const section = document.getElementById('whatSection');
    const card    = document.getElementById('whatCard');
    const bg      = document.getElementById('whatBg');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) card.classList.add('visible');
        });
    }, { threshold: 0.55 });
    observer.observe(section);

    function doParallaxWhat() {
        const rect     = section.getBoundingClientRect();
        const viewH    = window.innerHeight;
        const progress = (viewH - rect.top) / (viewH + rect.height);
        const shift    = (progress - 0.5) * 400;
        bg.style.transform = `translateY(${shift}px)`;
    }
    doParallaxWhat();
    window.addEventListener('scroll', doParallaxWhat, { passive: true });
}
</script>
